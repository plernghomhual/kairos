name: Kairos CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: kairos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check kairos/ tests/
          ruff format --check kairos/ tests/

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: test -f Dockerfile

      - name: Build image
        run: docker build -t kairos-ci .

  test:
    name: ${{ matrix.suite }} tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        suite: [fast, slow]
        include:
          - suite: fast
            pytest-args: -k "not backtest and not integration"
          - suite: slow
            pytest-args: -k "backtest or integration"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Restore pytest cache and prior results
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .ci-test-results/${{ matrix.suite }}/python-${{ matrix.python-version }}
          key: ${{ runner.os }}-pytest-${{ matrix.suite }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'kairos/**/*.py', 'tests/**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pytest-${{ matrix.suite }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          mkdir -p .ci-test-results/${{ matrix.suite }}/python-${{ matrix.python-version }}
          python -m pytest tests/ -v --tb=short ${{ matrix.pytest-args }} --junitxml=.ci-test-results/${{ matrix.suite }}/python-${{ matrix.python-version }}/test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}-${{ matrix.python-version }}
          path: .ci-test-results/${{ matrix.suite }}/python-${{ matrix.python-version }}/test-results.xml
